<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayerZero 跨链桥 DApp (Ethers v6)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .log-box {
            margin-top: 20px;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .wallet-status { text-align: center; margin-bottom: 20px; font-size: 14px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>LayerZero 跨链桥 <small style="font-size: 12px; color: #7f8c8d;">(v6)</small></h2>
    
    <div class="wallet-status" id="walletStatus">未连接钱包</div>
    <button id="connectBtn" onclick="connectWallet()">连接 MetaMask</button>

    <div class="form-group" style="margin-top: 20px;">
        <label for="contractSelect">选择金库合约</label>
        <select id="contractSelect">
            <option value="0xf33D21137cD0B878f3A18Cc60cD74F842c59cb00">合约 A: 0xf33D...cb00</option>
            <option value="0x6c92CEEb09C83f1018d5BCA81d933df3eEaEd0A1">合约 B: 0x6c92...d0A1</option>
        </select>
    </div>

    <div class="form-group">
        <label for="amount">跨链数量</label>
        <input type="number" id="amount" placeholder="输入跨链代币数量 (如: 100)" min="0" step="any">
    </div>

    <div class="form-group">
        <label for="dstEid">目标链 Endpoint ID (V2)</label>
        <input type="number" id="dstEid" placeholder="例如 Arbitrum: 30110, OP: 30114" value="30101">
    </div>

    <button id="bridgeBtn" onclick="executeBridge()" disabled>执行跨链 (Bridge)</button>

    <div class="log-box" id="logBox">系统就绪，等待操作...</div>
</div>

<script>
    let provider, signer, userAddress;

    // 跨链必需的核心 ABI
    const contractABI = [
        {
            "inputs": [{
                "components": [
                    {"internalType": "uint256", "name": "amount", "type": "uint256"},
                    {"internalType": "address", "name": "toAddress", "type": "address"},
                    {"internalType": "address", "name": "refundAddress", "type": "address"},
                    {"internalType": "uint32", "name": "dstEid", "type": "uint32"}
                ],
                "internalType": "struct IOftRouter.DecentBridgeCall",
                "name": "bridgeCall",
                "type": "tuple"
            }],
            "name": "quoteWithdrawAndSend",
            "outputs": [{"internalType": "uint256", "name": "nativeFee", "type": "uint256"}],
            "stateMutability": "view",
            "type": "function"
        },
        {
            "inputs": [{
                "components": [
                    {"internalType": "uint256", "name": "amount", "type": "uint256"},
                    {"internalType": "address", "name": "toAddress", "type": "address"},
                    {"internalType": "address", "name": "refundAddress", "type": "address"},
                    {"internalType": "uint32", "name": "dstEid", "type": "uint32"}
                ],
                "internalType": "struct IOftRouter.DecentBridgeCall",
                "name": "bridgeCall",
                "type": "tuple"
            }],
            "name": "withdrawAndSend",
            "outputs": [],
            "stateMutability": "payable",
            "type": "function"
        }
    ];

    function log(message) {
        const logBox = document.getElementById('logBox');
        logBox.innerHTML += `\n> ${message}`;
        logBox.scrollTop = logBox.scrollHeight;
        console.log(message);
    }

    async function connectWallet() {
        if (typeof window.ethereum === 'undefined') {
            alert("请先安装并连接 MetaMask！");
            return;
        }

        try {
            // [v6 变更] 使用 BrowserProvider 替代 Web3Provider
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            // [v6 变更] getSigner() 现在是一个异步方法，必须 await
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            
            document.getElementById('walletStatus').innerText = `已连接: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}`;
            document.getElementById('walletStatus').style.color = '#27ae60';
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('bridgeBtn').disabled = false;
            
            log("钱包连接成功: " + userAddress);
        } catch (error) {
            log("连接钱包失败: " + error.message);
        }
    }

    async function executeBridge() {
        if (!signer) {
            alert("请先连接钱包！");
            return;
        }

        const contractAddress = document.getElementById('contractSelect').value;
        const amountInput = document.getElementById('amount').value;
        const dstEid = document.getElementById('dstEid').value;

        if (!amountInput || amountInput <= 0) {
            alert("请输入有效的跨链数量！");
            return;
        }

        try {
            document.getElementById('bridgeBtn').disabled = true;
            document.getElementById('bridgeBtn').innerText = "处理中...";

            const contract = new ethers.Contract(contractAddress, contractABI, signer);
            
            // [v6 变更] 移除了 ethers.utils 命名空间，直接使用 ethers.parseUnits
            const parsedAmount = ethers.parseUnits(amountInput, 18); 

            const bridgeCallParams = {
                amount: parsedAmount,
                toAddress: userAddress,
                refundAddress: userAddress,
                dstEid: parseInt(dstEid)
            };

            log(`[1/3] 正在向合约 ${contractAddress.substring(0,6)}... 询价跨链 Gas 费...`);
            
            const nativeFee = await contract.quoteWithdrawAndSend(bridgeCallParams);
            
            // [v6 变更] 移除了 ethers.utils，直接使用 ethers.formatEther
            const feeInEth = ethers.formatEther(nativeFee);
            log(`询价成功！预估需支付: ${parseFloat(feeInEth).toFixed(6)} ETH 作为跨链费。`);

            log("[2/3] 请在 MetaMask 中确认跨链交易...");
            const tx = await contract.withdrawAndSend(bridgeCallParams, {
                value: nativeFee
            });

            log(`交易已发送！Hash: ${tx.hash}`);
            log("[3/3] 等待区块链打包确认...");

            // 等待区块确认
            const receipt = await tx.wait();
            log(`🎉 跨链交易成功！区块高度: ${receipt.blockNumber}`);

        } catch (error) {
            let errorMsg = error.message;
            // 尝试捕获合约执行失败的具体原因
            if (error.info && error.info.error && error.info.error.message) {
                errorMsg = error.info.error.message;
            } else if (error.reason) {
                errorMsg = error.reason;
            }
            log("❌ 交易失败或被拒绝: " + errorMsg);
        } finally {
            document.getElementById('bridgeBtn').disabled = false;
            document.getElementById('bridgeBtn').innerText = "执行跨链 (Bridge)";
        }
    }
</script>

</body>
</html>
