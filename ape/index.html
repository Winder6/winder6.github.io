<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
     <meta name="robots" content="noindex, nofollow">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .log-box {
            margin-top: 20px;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .wallet-status { text-align: center; margin-bottom: 20px; font-size: 14px; color: #7f8c8d; }
        .network-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 5px; background: #e0e0e0; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>LayerZero 跨链桥</h2>
    
    <div class="wallet-status" id="walletStatus">未连接钱包 <span class="network-badge" id="currentNetworkBadge">未知网络</span></div>
    <button id="connectBtn" onclick="connectWallet()">连接 MetaMask</button>

    <div class="form-group" style="margin-top: 20px;">
        <label for="sourceChainSelect">选择源链 (Source Chain)</label>
        <select id="sourceChainSelect" onchange="handleChainChange()">
            <option value="33139" selected>🐵 ApeChain (Mainnet)</option>
            <option value="1">🔷 Ethereum (Mainnet)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="contractSelect">选择金库合约</label>
        <select id="contractSelect">
            <option value="0xf33D21137cD0B878f3A18Cc60cD74F842c59cb00">合约u: 0xf33D...cb00</option>
            <option value="0x6c92CEEb09C83f1018d5BCA81d933df3eEaEd0A1">合约e: 0x6c92...d0A1</option>
        </select>
    </div>

    <div class="form-group">
        <label for="amount">跨链数量</label>
        <input type="number" id="amount" placeholder="输入跨链代币数量 (如: 100)" min="0" step="any">
    </div>

    <div class="form-group">
        <label for="dstEid">目标链 Endpoint ID (V2)</label>
        <input type="number" id="dstEid" placeholder="例如 Arbitrum: 30110, OP: 30114" value="30101">
    </div>

    <button id="bridgeBtn" onclick="executeBridge()" disabled>执行跨链 (Bridge)</button>

    <div class="log-box" id="logBox">系统就绪，等待操作...</div>
</div>

<script>
    let provider, signer, userAddress;

    // 网络配置数据 (用于切换或添加网络)
    const NETWORKS = {
        '33139': {
            chainId: '0x8173', // 33139 的 16 进制
            chainName: 'ApeChain',
            nativeCurrency: { name: 'ApeCoin', symbol: 'APE', decimals: 18 },
            rpcUrls: ['https://rpc.apechain.com'],
            blockExplorerUrls: ['https://explorer.apechain.com']
        },
        '1': {
            chainId: '0x1', // 1 的 16 进制
            chainName: 'Ethereum Mainnet'
            // ETH 主网通常不需要 rpcUrls，MetaMask 自带
        }
    };

    const contractABI = [
        {
            "inputs": [{
                "components": [
                    {"internalType": "uint256", "name": "amount", "type": "uint256"},
                    {"internalType": "address", "name": "toAddress", "type": "address"},
                    {"internalType": "address", "name": "refundAddress", "type": "address"},
                    {"internalType": "uint32", "name": "dstEid", "type": "uint32"}
                ],
                "internalType": "struct IOftRouter.DecentBridgeCall",
                "name": "bridgeCall",
                "type": "tuple"
            }],
            "name": "quoteWithdrawAndSend",
            "outputs": [{"internalType": "uint256", "name": "nativeFee", "type": "uint256"}],
            "stateMutability": "view",
            "type": "function"
        },
        {
            "inputs": [{
                "components": [
                    {"internalType": "uint256", "name": "amount", "type": "uint256"},
                    {"internalType": "address", "name": "toAddress", "type": "address"},
                    {"internalType": "address", "name": "refundAddress", "type": "address"},
                    {"internalType": "uint32", "name": "dstEid", "type": "uint32"}
                ],
                "internalType": "struct IOftRouter.DecentBridgeCall",
                "name": "bridgeCall",
                "type": "tuple"
            }],
            "name": "withdrawAndSend",
            "outputs": [],
            "stateMutability": "payable",
            "type": "function"
        }
    ];

    function log(message) {
        const logBox = document.getElementById('logBox');
        logBox.innerHTML += `\n> ${message}`;
        logBox.scrollTop = logBox.scrollHeight;
        console.log(message);
    }

    // 监听网络切换下拉菜单事件
    async function handleChainChange() {
        if (!signer) return; // 如果还没连钱包，先不触发切换
        await ensureCorrectNetwork();
    }

    // 核心切换网络逻辑
    async function ensureCorrectNetwork() {
        if (!window.ethereum) return false;
        
        const targetChainIdStr = document.getElementById('sourceChainSelect').value;
        const targetNetwork = NETWORKS[targetChainIdStr];
        
        try {
            // 获取当前钱包所在的网络
            const currentNetwork = await provider.getNetwork();
            
            // 如果已经在目标网络，直接返回
            if (currentNetwork.chainId.toString() === targetChainIdStr) {
                updateNetworkBadge(targetChainIdStr);
                return true;
            }

            log(`正在请求钱包切换至: ${targetNetwork.chainName}...`);
            
            // 请求切换网络
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: targetNetwork.chainId }],
            });
            
            updateNetworkBadge(targetChainIdStr);
            log(`成功切换网络至: ${targetNetwork.chainName}`);
            
            // 重新初始化 provider 和 signer 以匹配新网络
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            
            return true;
        } catch (error) {
            // 错误码 4902 表示用户的 MetaMask 尚未添加该网络
            if (error.code === 4902 && targetChainIdStr === '33139') {
                try {
                    log(`钱包未配置 ApeChain，正在请求添加网络...`);
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [targetNetwork],
                    });
                    
                    updateNetworkBadge(targetChainIdStr);
                    log(`成功添加并切换到 ApeChain!`);
                    
                    provider = new ethers.BrowserProvider(window.ethereum);
                    signer = await provider.getSigner();
                    return true;
                } catch (addError) {
                    log(`❌ 添加网络失败: ${addError.message}`);
                    return false;
                }
            } else {
                log(`❌ 切换网络失败: ${error.message}`);
                return false;
            }
        }
    }

    function updateNetworkBadge(chainIdStr) {
        const badge = document.getElementById('currentNetworkBadge');
        if (chainIdStr === '33139') {
            badge.innerText = '🐵 ApeChain';
            badge.style.background = '#0052ff';
            badge.style.color = '#fff';
        } else if (chainIdStr === '1') {
            badge.innerText = '🔷 Ethereum';
            badge.style.background = '#627eea';
            badge.style.color = '#fff';
        } else {
            badge.innerText = '未知网络';
            badge.style.background = '#e0e0e0';
        }
    }

    async function connectWallet() {
        if (typeof window.ethereum === 'undefined') {
            alert("请先安装并连接 MetaMask！");
            return;
        }

        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            
            document.getElementById('walletStatus').innerHTML = `已连接: ${userAddress.substring(0, 6)}...${userAddress.substring(38)} <span class="network-badge" id="currentNetworkBadge"></span>`;
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('bridgeBtn').disabled = false;
            
            log(`钱包连接成功: ${userAddress}`);
            
            // 连接后，立刻校验并切换到下拉框选中的默认网络 (ApeChain)
            await ensureCorrectNetwork();

            // 监听用户在 MetaMask 里手动切换网络的情况
            window.ethereum.on('chainChanged', () => {
                window.location.reload();
            });

        } catch (error) {
            log("连接钱包失败: " + error.message);
        }
    }

    async function executeBridge() {
        if (!signer) {
            alert("请先连接钱包！");
            return;
        }

        // 跨链前做最后一次网络校验，防止用户手动切走了网络
        const isCorrectNetwork = await ensureCorrectNetwork();
        if (!isCorrectNetwork) {
            alert("网络切换失败，请检查钱包网络设置！");
            return;
        }

        const contractAddress = document.getElementById('contractSelect').value;
        const amountInput = document.getElementById('amount').value;
        const dstEid = document.getElementById('dstEid').value;

        if (!amountInput || amountInput <= 0) {
            alert("请输入有效的跨链数量！");
            return;
        }

        try {
            document.getElementById('bridgeBtn').disabled = true;
            document.getElementById('bridgeBtn').innerText = "处理中...";

            const contract = new ethers.Contract(contractAddress, contractABI, signer);
            
            // 将输入的数量转为 wei (ApeCoin 和 ETH 的精度均为 18)
            const parsedAmount = ethers.parseUnits(amountInput, 18); 

            const bridgeCallParams = {
                amount: parsedAmount,
                toAddress: userAddress,
                refundAddress: userAddress,
                dstEid: parseInt(dstEid)
            };

            const currentChainName = document.getElementById('sourceChainSelect').options[document.getElementById('sourceChainSelect').selectedIndex].text;
            log(`[1/3] 正在通过 ${currentChainName} 向合约询价 Gas 费...`);
            
            const nativeFee = await contract.quoteWithdrawAndSend(bridgeCallParams);
            const feeInEth = ethers.formatEther(nativeFee);
            
            // 动态显示是 ETH 还是 APE 作为手续费
            const feeSymbol = document.getElementById('sourceChainSelect').value === '33139' ? 'APE' : 'ETH';
            log(`询价成功！预估需支付: ${parseFloat(feeInEth).toFixed(6)} ${feeSymbol} 作为跨链费。`);

            log("[2/3] 请在 MetaMask 中确认跨链交易...");
            const tx = await contract.withdrawAndSend(bridgeCallParams, {
                value: nativeFee,
                gasLimit: 1669195,

            });

            log(`交易已发送！Hash: ${tx.hash}`);
            log("[3/3] 等待区块链打包确认...");

            const receipt = await tx.wait();
            log(`🎉 跨链交易成功！区块高度: ${receipt.blockNumber}`);

        } catch (error) {
            let errorMsg = error.message;
            if (error.info && error.info.error && error.info.error.message) {
                errorMsg = error.info.error.message;
            } else if (error.reason) {
                errorMsg = error.reason;
            }
            log("❌ 交易失败或被拒绝: " + errorMsg);
        } finally {
            document.getElementById('bridgeBtn').disabled = false;
            document.getElementById('bridgeBtn').innerText = "执行跨链 (Bridge)";
        }
    }
</script>

</body>
</html>
